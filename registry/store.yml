  - id: "1512550218044805150"
    kind: plugins
    name: "[v1.0.1] Snooze-Manager (A Plug-in Collection)"
    description: "Snooze-Manager is a modular plug-in manager for Pengu Loader. Each
      QoL feature is implemented as a separate module, and the manager loads
      them together while keeping configuration consolidated. Everything is
      built to be lightweight and event driven: no embedded React application,
      no bloat, no constant polling of the client for changes and so on. Some
      features are inspired by earlier work, but the implementation here is
      independent and expanded to offer more than a straight copy."
    details: "Auto Lock Champion:\r

      - **\"Lock X seconds before turn ends\"** — set a timer to lock your
      pick/ban automatically when your turn's countdown reaches X seconds,
      instead of using a fixed delay\r

      - **Panic Key (F2)** — press during champ select to cancel all future
      auto-lock actions for that game only; auto-lock re-enables on the next
      game\r

      - **Separate \"Auto Lock-in Pick\" / \"Auto Lock-in Ban\"** — toggles. no
      more forced both-or-neither\r

      \r

      Whale Helper:\r

      - **\"Champion select Hide Unowned Skins & Chromas\"** — filters out
      unowned skins/chromas in champ select for a less cluttered skin carousel &
      chroma picker \r

      \r

      Bugs:\r

      - Fixed Auto-Honor After Update\r

      <img width=\"1764\" height=\"1228\" alt=\"image\"
      src=\"https://github.com/user-attachments/assets/b7713e73-5664-4be3-bf82-\
      45d66b6f6759\" />\r\n"
    repo: https://github.com/ReformedDoge/Snooze-Manager
