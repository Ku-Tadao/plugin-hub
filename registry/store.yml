    kind: themes
    name: Pyken's Theme - Based on ElainaV4
    description: "League of Legends v14.22, use Pengu Loader v1.1.4, based entirely
      on ElainaV4. Download .zip: & add to Pengu's plugin folder. If you have
      any issues such as theme/plugin settings not appearing, try deleting any
      outdated files, and then restart your computer. For issues with wallpaper
      not appearing, goto to theme settings in your client & manually enter the
      wallpaper name (exp. Naruto 1.webm) Add Done CTRL + R Select Naruto 1.webm
      from the dropdown menu in Home Page. Do the same for banners, etc. To find
      these file names, goto your plugin folder assets background properties You
      can save these files (from backgrounds/icons) and save them for a quick
      replacement on future Elaina releases. Download your own audio (.mp3), add
      to audio folder, add audio file name under theme settings & restart client
      (CTRL + R). -- All credits belong to <@689073511142391835 : | I'm simply
      swapping a few files which anyone can do. If you want to customize your
      own backgrounds/icons, simply replace the current files with new ones
      (some files like require it's name & file type to match the original's)."
