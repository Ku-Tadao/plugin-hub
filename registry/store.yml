  - id: "1475139802482479317"
    kind: plugins
    name: 🩺 Mayhem Doctor
    description: Your personal ARAM Mayhem analyst, built right into the League client.
    details: "This release introduces standalone window support and an overhaul of
      the dashboard's responsive architecture across all window sizes and
      resolutions.\r

      \r

      <img width=\"1353\" height=\"861\" alt=\"image\"
      src=\"https://github.com/user-attachments/assets/18f20d66-c565-4e22-bb81-\
      d54089889970\" />\r

      <img width=\"1353\" height=\"861\" alt=\"image\"
      src=\"https://github.com/user-attachments/assets/2de1dede-9cac-4a23-9c71-\
      f69cd78bc874\" />\r

      \r

      **Core Features**\r

      * **Pop-Out Window Support:** The interface can now be rendered in a
      standalone, dedicated pop-out window.\r

      * **Custom Window Resizing:** Added an interactive drag handle to the
      bottom-right corner of the pop-out window for fluid, real-time resizing.\r

      * **Size Presets and Settings:** New window size preferences (Compact,
      Standard, Large, and Custom) are available in the settings tab and stay
      synchronized with manual drag-resizing.\r

      \r

      **UI and UX Improvements**\r

      * **Responsive Dashboard Layout:** The dashboard CSS has been refactored
      to utilize dynamic flexbox scaling.\r

      * **Adaptive Elements:** Dashboard components now automatically adapt and
      re-distribute to fit both compact in-client views and large pop-out
      windows without cutoff borders or vertical scrollbars.\r\n"
