    name: BLACKJACK ULTIMATE
    description: A blackgame made for pengu loader to play in league
    details: "🃏 BLACKJACK ULTIMATE v2.0 — Pengu Loader Plugin\r

      \r

      Full casino-style blackjack running right inside your League client.\r

      \r

      Core rules\r

      - Real blackjack with 6-deck shoe\r

      - Double down, split pairs, surrender (get half back), insurance on dealer
      Ace\r

      - Pays 3:2 | Dealer hits soft 17 | 5-Card Charlie auto-wins\r

      \r

      Cool features\r

      - Side bets: Perfect Pairs (up to 25:1) + 21+3 (up to 100:1)\r

      - Play 1–3 hands at once\r

      - Hi-Lo card counting (running + true count)\r

      - Live basic strategy coach + explanations\r

      - Real-time bust % if you hit\r

      - XP system + 10 levels (Novice → Casino Legend)\r

      - 15 persistent achievements\r

      - Last 20 hands history\r

      - Daily tournament (1000 starting chips, resets daily)\r

      - 4 themes (Dark Velvet, Runeterra, Las Vegas, VIP Black)\r

      - Sounds via Web Audio API + mute option\r

      - Draggable & resizable floating window\r

      - Saves balance, stats, XP, achievements & history across restarts\r

      \r

      🆕 What's new in v2.0 — Elaina Theme compatibility\r

      - Removed floating card button (was being blocked by Elaina)\r

      - Game now opens with Alt+B from anywhere in the client\r

      - CSS injected at the end of <head> to win cascade priority over Elaina\r

      - MutationObserver keeps our styles last if Elaina reorders them\r

      - Overlay uses isolation + contain to prevent Elaina CSS from bleeding
      in\r

      \r

      How to play\r

      - Press Alt+B to open / close the game\r

      - Pick your bet chips → Deal\r

      - Controls: Hit / Stand / Double / Split / Surrender\r

      - Left sidebar: stats, toggles for coach, bust %, counting mode"
