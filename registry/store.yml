  - id: "1370379492354162729"
    kind: plugins
    name: newDodgeTracker 新的躲避列表
    description: "DodgeTracker 躲避列表工具 安装指南 下载并安装 Pengu Loader（要求版本 = 1.1.6） 从发布页面（
      newDodgeTracker.zip 文件 将 ZIP 文件解压后放入客户端的 plugins 插件文件夹中 如何添加玩家到躲避列表？
      方法一：手动添加 打开英雄联盟客户端设置 找到「躲避追踪器」并点击「躲避列表」 在输入框按格式输入：玩家名称标签（例如：疾风剑豪456894）
      点击「添加玩家」完成操作 方法二：快捷操作 在以下界面右键点击玩家名称： 对局结算界面 历史战绩页面 组队房间列表 选择「死亡笔记」选项即可
      功能特性 支持玩家名称的标签（Tag）和备注功能 自动适配客户端语言（中文客户端显示中文，其他语言客户端显示英文） 致谢 本插件基于
      iIlusion/DodgeTracker（ DodgeTracker Dodge List Tool Installation Guide
      Download and install Pengu Loader (requires version = 1.1.6) Download
      newDodgeTracker.zip from Releases page: Extract the ZIP file into the
      client's plugins folder How to Add Players to Dodge List? Method 1: Manual
      Addition Open League of Legends client settings Navigate to \"Dodge
      Tracker\" and click \"Dodge List\" Input in format: PlayerNameTag (e.g.,
      Yasuo456894) Click \"Add Player\" to complete Method 2: Quick Action
      Right-click player names in: Post-game lobby Match history page Party
      member list Select \"Add to Dodge List\" option Features Supports player
      tags and notes Automatic language adaptation (Chinese for CN client,
      English for others) Acknowledgements Modified from iIlusion/DodgeTracker（
      with added tag/note support and multilingual optimization. Thanks to the
      original author!"
    details: >-
      ## v1.2.3


      ### New Features

      - **Summoner Reveal integration** — Merged the "Summoner Name Reveal"
      plugin (by @dakota1337x) into DodgeTracker as a built-in module:
        - Eye icon button in champ select controls
        - Sidebar showing player stats (rank, winrate, KDA, most common role)
        - OP.GG and Porofessor multi-search links
        - Toggle switch in settings (default OFF)
        - Reuses DodgeTracker's already-fetched summoner data (no duplicate API calls)
      - **22-language support** for new `summonerRevealEnabled` and
      `summonerRevealDesc` translation keys


      ### Bug Fixes

      - **`/lol-summoner/v2/summoners?ids=` returns HTTP 400 on Pengu v1.2** —
      Added `getSummonersByIds()` fallback: tries v2 batch endpoint first, falls
      back to individual `/lol-summoner/v1/summoners/{id}` lookups

      - **Champ select loading too slow** — Replaced fixed 20-second delay with
      polling mechanism (checks every 1s, triggers when player count is stable +
      chat is ready, max 20s fallback)


      ### Improvements

      - `playersFromChampSelect()` now returns `{ names, summoners }` so the
      Summoner Reveal module can reuse puuid data without duplicate API calls

      - `removeRevealSidebar()` properly disconnects MutationObserver and cleans
      up all injected elements by class selector

      - Eye icon button uses class-based selectors instead of id to prevent
      duplicate elements


      ---


      ## v1.2.3


      ### 新功能

      - **融合召唤师信息（Summoner Reveal）** — 将 Summoner Name Reveal 插件（作者
      @dakota1337x）融合到 DodgeTracker 中作为内置模块：
        - 选人阶段控制栏显示眼睛图标按钮
        - 侧边栏显示玩家战绩（段位、胜率、KDA、常玩位置）
        - OP.GG 和 Porofessor 多人查询链接
        - 设置面板开关控制（默认关闭）
        - 复用 DodgeTracker 已获取的召唤师数据，无需重复 API 调用
      - **22 种语言**新增 `summonerRevealEnabled` 和 `summonerRevealDesc` 翻译键


      ### Bug 修复

      - **`/lol-summoner/v2/summoners?ids=` 在 Pengu v1.2 返回 400** — 新增
      `getSummonersByIds()` fallback：先尝试 v2 批量接口，失败则逐个调用
      `/lol-summoner/v1/summoners/{id}`

      - **选人阶段加载过慢** — 将固定 20 秒延迟改为轮询机制（每秒检查，玩家数量稳定 + 聊天室就绪即触发，最大兜底 20 秒）


      ### 优化

      - `playersFromChampSelect()` 返回值改为 `{ names, summoners }`，供 Summoner
      Reveal 模块复用 puuid 数据

      - `removeRevealSidebar()` 正确断开 MutationObserver 并按 class 清理所有注入元素

      - 眼睛图标按钮改用 class 选择器替代 id，防止重复元素残留
