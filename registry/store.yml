  - id: "1240541534663868426"
    kind: themes
    name: Kyso Clean Theme v2.0
    description: A simple and customizable league theme, without losing the "league
      experience"
    details: "This update focuses on fixing the \"Self-Only\" functionality (which
      restricts visual modifications to your own\r

      \  profile). These fixes ensure that crests and profile edits do not leak
      to other players' profiles when you are\r

      \  viewing them, even in more complex client rendering scenarios.\r

      \r

      \    **🐛 Bug Fixes**\r

      \    * **Self-Only Profile Detection**: Fixed own-profile detection to use
      more precise attributes (`summoner-id` /\r

      \  `puuid`) instead of name selectors, which were missing the actual real
      node in the client.\r

      \    * **Per-Surface Check**: Adjusted the code to validate profile
      ownership individually on each rendered surface.\r

      \  This resolves bugs that occurred because the League client can
      mount/render two profiles simultaneously in memory.\r

      \    * **Crest Self-ID Guard**: Fixed the `applyCrest` function so the
      \"Self-Only\" guard re-runs once your local ID is\r

      \  resolved, preventing your custom crest and icons from appearing on
      friends' profiles."
