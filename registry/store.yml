      - Add google font option for custom font\r

      \r

      - Fix custom name color bug when using with name spoofer\r

      \r

      - Update css\r

      \r

      - Allows syncing custom icons for people who are not friends of the user\r

      \r

      ### **IF you already install previous version (v4.5.0), download
      update-file.zip file, extract and replace the current one with it**\r

      After update, you should delete old cache:\r

      1, Open DevTools (Ctrl + Shift + i)\r

      2, Choose \"Network\" tab\r

      3, Tick \"Disable Cache\" checkbox\r

      4, Press Ctrl + Shift +  R to finish the process"
