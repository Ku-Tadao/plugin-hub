  - id: "1485799707526828102"
    kind: plugins
    name: Snooze-CSS (Theme loader / Theme Creator)
    description: An advanced visual sculpting and analysis suite for theming the
      League of Legends client
    details: "## Key Additions\r

      \r

      *   **IDE Bridge (Testing Phase):** Real-time, 2-way synchronization
      between Snooze-CSS and your external editor. Edit your theme in your
      preferred environment and see visual changes instantly in the client. \r

      \    *   **Official Support:** Dedicated plugins for **Notepad++ (x86 &
      x64)** and a **VS Code extension** are now available for testing.\r

      *   **Enhanced Generic Tools:** Improvements to some Generic tab presets.
      Including **Scrollbars**, **Settings Dialogs**, **Readability**, and
      **Background Dimming** have transitioned from simple toggles to granular
      sliders\r

      \r

      ## Technical\r

      \r

      *   **Asset Validation:** Improved file pickers with a new validation
      layer. The file picker now automatically verifies if assets are correctly
      placed in the `/assets` folder and provides non-blocking guidance for
      invalid paths.\r

      ---\r

      \r

      ## 🛠 For Developers: IDE Bridge Protocol\r

      \r

      The Snooze-CSS IDE Bridge is designed to be **IDE-agnostic**. If you wish
      to build a bridge for an unsupported editor (Sublime, Vim, etc.), the
      protocol uses a standard WebSocket transport.\r

      \r

      *   **Transport:** WebSocket\r

      *   **Default Port:** `8765` (Configurable in Snooze-CSS settings)\r

      \r

      ### Protocol Specification\r

      \r

      **1. Client → IDE: Initialization (`init`)**  \r

      Sent when the client first connects to the IDE to sync the current CSS
      buffer.\r

      ```json\r

      {\r

      \  \"action\": \"init\",\r

      \  \"css\": \"/* Initial CSS from the active Snooze-CSS profile */\"\r

      }\r

      ```\r

      \r

      **2. Client → IDE: Visual Sync (`client-update`)**  \r

      Sent when changes are made inside the Snooze-CSS Visual Builder.\r

      ```json\r

      {\r

      \  \"action\": \"client-update\",\r

      \  \"css\": \"/* Updated CSS from the client */\"\r

      }\r

      ```\r

      \r

      **3. IDE → Client: Code Sync (`update`)**  \r

      When a \"Save\" event is triggered in your IDE, your plugin should send
      this to the client. The client will instantly apply the CSS and update the
      \"Raw CSS\" tab.\r

      ```json\r

      {\r

      \  \"action\": \"update\",\r

      \  \"css\": \"/* Full CSS file buffer */\"\r

      }\r

      ```\r

      \r

      > [!NOTE]\r

      > The `css` field must be the entire file buffer as a single JSON-escaped
      string (e.g., `JSON.stringify(content)`)."
