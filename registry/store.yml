      2. Choose Manually update theme list\r

      3. Scroll down → find the Background field\r

      4. Ex: Enter Lupa.mp4 → add\r

      5. Scroll down → find the Music field\r

      6. Ex: Enter Running For Your Life.mp3 → add\r

      7. Done → Close Setting\r

