    details: "- **This interface is a modified version of the original ElainaV4,
      redesigned with a Wuthering Waves – Phrolova theme. I’ve adjusted it to
      make it more appealing and suitable for a wider range of users**\r

      \r

      - **PhrolovaThemeSettingBackup.js** - Used to restore the original
      settings in case you accidentally tweak something too much.\r

      - Theme Installation Guide:
      https://github.com/Elaina69/Elaina-theme/wiki/1.-Installation\r

      \r

      **Usage Instructions:**\r

      \r

      1. Go to Settings in LoL → select Theme Settings\r

      2. Choose Manually update theme list\r

      3. Scroll down → find the Background field\r

      4. Enter: Lupa.mp4 → add\r

      5. Scroll down → find the Music field\r

      6. Enter: Running For Your Life.mp3 → add\r

      7. Done → Close Setting\r

      8. Press Ctrl + R to restart Client and enjoy\r

      \r

