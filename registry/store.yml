    kind: plugins
    name: Background Customizer
    description: Background Customizer for League of Legends using Penguloader
    details: "v2.0 — Full Rebuild\r

      \r

      Complete rewrite of the plugin focused on stability, performance, and a
      cleaner UI.\r

      \r

      What's changed:\r

      \r

      - Replaced the entire background engine with a pooled layer system to
      prevent Chromium GPU memory leaks\r

      - Ui Overhaul\r

      - New Auto Clean Memory setting — automatically restarts the client UX
      when you load into a game to flush accumulated cache\r

      - Sidebar navigation\r

      - Welcome guide on first launch\r

      - Custom background file limit raised to 50MB\r

      - General code cleanup, comment polish, and consistent v2 versioning
      throughout"
