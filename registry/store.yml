  - id: "1512550218044805150"
    kind: plugins
    name: "[v1.1.0] Snooze-Manager (A Plug-in Collection)"
    description: "Snooze-Manager is a modular plug-in manager for Pengu Loader. Each
      QoL feature is implemented as a separate module, and the manager loads
      them together while keeping configuration consolidated. Everything is
      built to be lightweight and event driven: no embedded React application,
      no bloat, no constant polling of the client for changes and so on. Some
      features are inspired by earlier work, but the implementation here is
      independent and expanded to offer more than a straight copy."
    details: "**Snooze-Manager v1.1.0 is out!**\r

      <img width=\"1101\" height=\"716\" alt=\"image\"
      src=\"https://github.com/user-attachments/assets/b4c6413d-e95b-4a4a-9865-\
      6abbefd8ea46\" />\r

      \r

      **What's new**\r

      \r

      The plugin is now fully translated - module names, settings labels,
      tooltips, status messages and toasts. \r

      Supported languages: English (default), Spanish, French, Korean, Chinese,
      Portuguese (Brazil) and Turkish. \r

      Switch language in Settings -> Language. Anything untranslated falls back
      to English.\r

      \r

      New module: **Use Client In Game** - dismisses the full-screen \"game in
      progress\" screen so you can browse the client (profile, collection, etc.)
      while a match is running. It comes back automatically after the game.\r

      \r

      **Auto Honor** has a new \"Prefer Friends\" option - honors your friends
      first within allies / enemies / random, with a heart badge on their honor
      cards.\r

      \r

      **Auto Select Champion** upgrades:\r

      - hover-then-lock with a configurable \"Hover after X seconds\" delay\r

      - \"Respect Team Intent\" - never auto-bans what a teammate intends to
      pick\r

      - \"Allow Manual Pick\" - your manual changes allow take over for current
      queued action\r

      - Searchable priority picker with champion icons and keyboard navigation\r

      - Bans are limited to the active bannable set; banned/already-picked
      champions are skipped\r

      - Lock timing is more accurate: \"before turn ends\" follows the live
      server timer, \"after turn starts\" measures from the actual turn start.\r

      - Renamed to \"Auto Select\"\r

      **Balance Tooltip**: \r

      - Swiftplay support alongside ARAM, Arena, Nexus Blitz, One For All, URF,
      Ultimate Spellbook.\r

      - Raw stat adjustments (+X / -X for base stats like health, armor, damage)
      now shown in Arena and Swiftplay, not just percentage modifiers.\r

      - Renamed to \"Mode Balance Info\".\r

      \r

      **Whale Helper**:\r

      - Tencent / CN client support with the full Chinese rarity system and gem
      icons; badges repositioned to avoid overlapping the chroma overlay.\r

      - Loot odds previewer now has a \"[View]\" link that lists every item in a
      drop pool with its icon and name.\r

      \r

      **Penalty UI Suppression**:\r

      - Now also suppresses the restriction-info warning tooltip (chat
      restriction, ranked restriction, redemption games), behind its own
      toggle.\r

      - Renamed from \"Low Priority Warning Suppress\"; old setting is migrated
      automatically.\r

      - Player-restriction warning section is hidden as well.\r

      \r

      \r

      Other improvements:\r

      - Mode Selector Tweaks: New hideable game modes (ARAM Mayhem, Mayhem
      (Classic), SR (Classic)); remaining cards keep a consistent layout instead
      of Riot's new compacted one\r

      - Auto Accept: new \"Hide queue pop\" option; lobby/champ-select dodge
      detection fixed\r

      - Queue labels for classic modes (\"Normal\", Mayhem (Classic), SR
      (Classic), customs, CO-OP SR)\r

      - Auto Queue: 5-second default delay before re-queue, so you can react\r

      \r

      Fixes:\r

      - Auto Honor: KDA/score badges now show up reliably (deferred until data
      is ready, with retries)\r

      - Auto Honor: multi-vote delay no longer applied after the last vote"
